apiVersion: v1
kind: Namespace
metadata:
  name: e2e
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-content
  namespace: e2e
data:
  # A known body lets the checks assert they reached *this* nginx rather than
  # anything else that happens to answer on port 80.
  index.html: |
    terraform-provider-minikube e2e ok
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: e2e
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          # alpine ships busybox wget, which the in-cluster service and DNS
          # checks use - no second image to pull.
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: content
          configMap:
            name: nginx-content
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: e2e
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
